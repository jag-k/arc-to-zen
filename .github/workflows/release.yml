name: Release to PyPI

on:
  push:
    tags: ['v*']
  # Manual runs verify and build only; they never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: Build and verify distributions
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          enable-cache: true
          python-version: '3.13'

      - name: Install locked development dependencies
        run: uv sync --locked

      - name: Verify release tag matches the package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --locked python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must match package version {expected!r}")
          print(f"Verified release version: {version}")
          PY

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Verify distribution metadata and README
        run: uv run --locked twine check --strict dist/*

      - name: Verify the installed wheel CLI
        run: uv run --isolated --no-project --with "$PWD"/dist/*.whl -- arc-to-zen --help

      - name: Upload distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arc-to-zen
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with Trusted Publishing and attestations
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          attestations: true
          print-hash: true
