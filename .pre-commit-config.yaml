# https://pre-commit.com/
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, post-checkout, post-merge, post-rewrite]

default_language_version:
  python: python3.13

# Local exports and browser profiles must never be checked or staged by tooling.
exclude: ^(previews/|arc-to-zen-backups/|dist/|\.venv/)|\.jsonlz4$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent=4]
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.21
    hooks:
      - id: uv-lock
      - id: uv-sync

  - repo: https://github.com/bwhmather/ssort
    rev: 0.17.0
    hooks:
      - id: ssort

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.91
    hooks:
      - id: ty

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: pytest
        name: pytest (no browser)
        entry: uv run --locked pytest
        language: system
        types: [python]
        pass_filenames: false
